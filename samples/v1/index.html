<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=1080, height=1920, initial-scale=1, maximum-scale=1"
    />
    <title>Next Flight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./../../bsp/sync/bmo_norway/flightsdata.js"></script>
  </head>
  <body>
    <main class="board" id="board">
      <p class="eyebrow" id="eyebrow">Departures</p>
      <h1 id="headline">Next departure</h1>
      <div class="meta-row">
        <div>
          <div class="meta-label">Gate</div>
          <div class="meta-value" id="gate">—</div>
        </div>
        <div class="meta-row__end">
          <div class="meta-label">Airport</div>
          <div class="meta-value" id="iata">—</div>
        </div>
      </div>
      <section class="card" id="content">
        <p class="empty">Loading flight data…</p>
      </section>
      <div class="clock" id="clock"></div>
      <p class="attribution">
        <a href="https://www.avinor.no" target="_blank" rel="noreferrer"
          >Flight data from Avinor</a
        >
      </p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
